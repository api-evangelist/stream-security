  /detection_rules:
    get:
      operationId: detectionRules-list
      summary: Get Detection Rules
      description: 'Retrieves all detection rules in the system. A detection rule specifies the conditions that trigger a security event.


        The response includes each rule’s name, severity, creation and update timestamps, status (enabled or disabled), labels, detection type, and owner.


        Use this endpoint to review existing rules, assess detection coverage, and manage configurations.'
      tags:
      - Detection Rules
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: skip
        schema:
          default: 0
          type: number
      - in: query
        name: limit
        schema:
          default: 10
          type: number
      - in: query
        name: name
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
                    created_at:
                      type: string
                    modified_at:
                      type: string
                    created_by:
                      type: string
                    description:
                      type: string
                    enabled:
                      type: boolean
                    type:
                      type: string
                      enum:
