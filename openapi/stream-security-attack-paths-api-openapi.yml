openapi: 3.2.0
info:
  title: Stream Security Attack Paths API
  description: Stream Security API for managing security rules, integrations, AI interactions, and more.
  version: 1.0.0
servers:
- url: https://{app}.streamsec.io/openapi
tags:
- name: Attack Paths
paths:
  /attack_paths/details/{resource_id}:
    get:
      operationId: attackPaths-details
      summary: Get Resource Attack Path Details
      description: 'Retrieves the complete attack path for a specified resource, showing the sequence of network and security components an attacker could traverse to reach it.


        The response returns one or more ordered paths, starting from the origin (e.g., Internet) and listing each intermediate element such as gateways, ACLs, security groups, load balancers, or other relevant resources.


        Parameters include the unique resource_id (required) and the optional workspace context.


        Use this endpoint to visualize potential exposure, assess lateral movement risk, and prioritize remediation actions.'
      tags:
      - Attack Paths
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: path
        name: resource_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  paths:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                  ports:
                    type: array
                    items:
                      type: object
                      properties:
                        start:
                          type: number
                        end:
                          type: number
                        protocol:
                          type: string
                      required:
                      - start
                      - end
                      - protocol
                      additionalProperties: false
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        resource_id:
                          type: string
                        port_ranges:
                          type: array
                          items:
                            type: object
                            properties:
                              start:
                                type: number
                              end:
                                type: number
                              protocol:
                                type: string
                            required:
                            - start
                            - end
                            - protocol
                            additionalProperties: false
                      required:
                      - resource_id
                      additionalProperties: false
                required:
                - paths
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /attack_paths:
    get:
      operationId: attackPaths-list
      summary: Get Attack Paths
      description: 'Retrieves all attack paths discovered within a workspace. Attack path is a condition in which an asset is both externally exploitable and has a cloud blast radius that allows it to potentially interact with or compromise internal resources.


        Each response entry includes the attack path ID, severity, associated finding types, and violations count.


        Use this endpoint to review all known attack paths, track exposed resources, and prioritize remediation efforts across the environment.'
      tags:
      - Attack Paths
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: attack_path_ids
        schema:
          type: array
          items:
            type: string
      - in: query
        name: resource_ids
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    description:
                      type: string
                    severity:
                      type: number
                    finding_types:
                      type: array
                      items:
                        type: string
                        enum:
                        - misconfiguration
                        - internet_exposed
                        - insecure_identity
                        - vulnerability
                        - high_privileges
                        - privilege_escalation
                        - data_access
                        - crown_jewel_access
                        - admin_privileges
                        - external_access
                        - segmentation_breach
                    violations_count:
                      type: number
                  required:
                  - id
                  additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /attack_paths/violations:
    get:
      operationId: attackPaths-violations
      summary: Get Attack Path Violations
      description: 'Retrieves all resources that are violating security posture rules and, as a result, create an attack path condition.


        An attack path occurs when an asset is both externally exploitable and has a cloud blast radius that allows it to potentially interact with or compromise internal resources.


        The response includes the resource IDs along with the timestamps indicating when each resource began violating the rule.'
      tags:
      - Attack Paths
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: attack_path_id
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        subject_id:
                          type: string
                        first_seen_timestamp:
                          type: string
                      required:
                      - subject_id
                      additionalProperties: false
                  total_count:
                    type: number
                required:
                - results
                - total_count
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
