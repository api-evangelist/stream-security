openapi: 3.2.0
info:
  title: Stream Security Network & Identity Logs API
  description: Stream Security API for managing security rules, integrations, AI interactions, and more.
  version: 1.0.0
servers:
- url: https://{app}.streamsec.io/openapi
tags:
- name: Network & Identity Logs
paths:
  /network/identity-logs:
    get:
      operationId: network-identityLogs
      summary: Get IAM Identity Activity Logs
      description: 'Retrieves identity-related activity logs from monitored environments, including event metadata, principal and destination details, network information, and the raw event payload.


        Supports filtering by account, action, identity, principal attributes, destination attributes, error details, region, timestamp, user agent, and other session context.


        Use this endpoint to review identity activity and correlate actions with other security detections.'
      tags:
      - Network & Identity Logs
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: src_ip
        schema:
          type: string
      - in: query
        name: identity
        schema:
          type: string
      - in: query
        name: principal_type
        schema:
          type: array
          items:
            type: string
      - in: query
        name: cloud_type
        schema:
          type: array
          items:
            type: string
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: array
          items:
            type: string
      - in: query
        name: destination
        schema:
          type: string
      - in: query
        name: activity_resource_id
        schema:
          type: string
      - in: query
        name: user_agent
        schema:
          type: string
      - in: query
        name: error_message
        schema:
          type: string
      - in: query
        name: account_id
        schema:
          type: array
          items:
            type: string
      - in: query
        name: src_resource_id
        schema:
          type: string
      - in: query
        name: src_resource_type
        schema:
          type: array
          items:
            type: string
      - in: query
        name: src_geo_iso
        schema:
          type: array
          items:
            type: string
      - in: query
        name: src_display_name
        schema:
          type: string
      - in: query
        name: src_nic_id
        schema:
          type: string
      - in: query
        name: src_is_tor
        schema:
          type: boolean
      - in: query
        name: src_ip_score
        schema:
          type: array
          items:
            type: number
      - in: query
        name: dst_type
        schema:
          type: array
          items:
            type: string
            enum:
            - s3_bucket
            - dynamodb_table
            - iam_role
      - in: query
        name: aggregate_by
        schema:
          type: string
          enum:
          - default
      - in: query
        name: principal_id
        schema:
          type: string
      - in: query
        name: session_id
        schema:
          type: string
      - in: query
        name: new_session_id
        schema:
          type: string
      - in: query
        name: from_timesatmp
        schema:
          type: string
      - in: query
        name: to_timestamp
        schema:
          type: string
      - in: query
        name: skip
        schema:
          default: 0
          type: number
      - in: query
        name: limit
        schema:
          default: 100
          type: number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {}
                  totalCount:
                    type: number
                required:
                - results
                - totalCount
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /network/k8s-audit-logs:
    get:
      operationId: network-k8sAuditLogs
      summary: Get Kubernetes Audit Logs
      description: 'Retrieves detailed Kubernetes audit logs from monitored clusters, including API server events, resource access patterns, security policy violations, and administrative actions.


        Supports filtering by namespace, resource type, verb actions, user identities, service accounts, admission controller decisions, and cluster-specific metadata.


        Use this endpoint to monitor Kubernetes security posture, track privileged operations, investigate policy violations, and ensure compliance with cluster governance requirements.'
      tags:
      - Network & Identity Logs
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: skip
        schema:
          default: 0
          type: number
      - in: query
        name: limit
        schema:
          default: 100
          type: number
      - in: query
        name: cluster_id
        schema:
          type: string
      - in: query
        name: account_id
        schema:
          type: array
          items:
            type: string
      - in: query
        name: verb
        schema:
          type: string
      - in: query
        name: principal_id
        schema:
          type: string
      - in: query
        name: principal_type
        schema:
          type: array
          items:
            type: string
      - in: query
        name: resource_type
        schema:
          type: array
          items:
            type: string
      - in: query
        name: namespace
        schema:
          type: string
      - in: query
        name: from_timesatmp
        schema:
          type: string
      - in: query
        name: to_timestamp
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {}
                  totalCount:
                    type: number
                required:
                - results
                - totalCount
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /network/traffic-logs:
    get:
      operationId: network-trafficLogs
      summary: Get Network Traffic Logs
      description: 'Retrieves comprehensive network traffic logs from monitored environments, including connection metadata, source and destination details, protocol information, and traffic flow data.


        Supports filtering by source/destination IP addresses, ports, protocols, connection states, traffic volumes, geographic regions, and time ranges.


        Use this endpoint to analyze network communication patterns, identify suspicious traffic flows, and investigate connectivity issues across your infrastructure.'
      tags:
      - Network & Identity Logs
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: skip
        schema:
          default: 0
          type: number
      - in: query
        name: limit
        schema:
          default: 100
          type: number
      - in: query
        name: src_ip
        schema:
          type: string
      - in: query
        name: dst_ip
        schema:
          type: string
      - in: query
        name: src_resource_id
        schema:
          type: string
      - in: query
        name: dst_resource_id
        schema:
          type: string
      - in: query
        name: protocol
        schema:
          type: array
          items:
            type: string
      - in: query
        name: src_geo_iso
        schema:
          type: array
          items:
            type: string
      - in: query
        name: dst_geo_iso
        schema:
          type: array
          items:
            type: string
      - in: query
        name: src_port_range
        schema:
          description: A number or a range of numbers (e.g. "5" or "5-10")
          type: string
          pattern: ^\d+(-\d+)?$
      - in: query
        name: dst_post_range
        schema:
          description: A number or a range of numbers (e.g. "5" or "5-10")
          type: string
          pattern: ^\d+(-\d+)?$
      - in: query
        name: action
        schema:
          type: array
          items:
            type: string
            enum:
            - ACCEPT
            - REJECT
            - UNKNOWN
      - in: query
        name: account_id
        schema:
          type: array
          items:
            type: string
      - in: query
        name: region
        schema:
          type: array
          items:
            type: string
      - in: query
        name: from_timestamp
        schema:
          type: string
      - in: query
        name: to_timestamp
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {}
                  totalCount:
                    type: number
                required:
                - results
                - totalCount
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
