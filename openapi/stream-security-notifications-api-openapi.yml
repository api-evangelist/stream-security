                description:
                  type: string
                  maxLength: 250
                enabled:
                  default: true
                  type: boolean
                event_type:
                  type: string
                  enum:
                  - cloud_event
                  - detection
                  - simulation_event
                channels:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        anyOf:
                        - type: string
                          enum:
                          - webhook
                          - splunk
                          - pagerduty
                          - microsoftteams
                          - opsgenie
                          - logzio
                          - googlecards
                          - paloaltocortexxsiam
                          - torq
                        - type: string
                          const: slack
