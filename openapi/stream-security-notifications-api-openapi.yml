                          - splunk
                          - pagerduty
                          - microsoftteams
                          - opsgenie
                          - logzio
                          - googlecards
                          - paloaltocortexxsiam
                          - torq
                        - type: string
                          const: slack
                      id:
                        type: string
                    required:
                    - type
                    - id
                condition:
                  type: object
                  properties:
                    main_filter:
                      type: object
                      properties:
                        operand:
                          type: string
                          enum:
                          - and
                          - or
                        filters:
                          type: array
                          items:
                            type: object
                            properties:
                              field:
                                type: string
                              match_type:
                                type: string
                                enum:
                                - is
                                - is_not
                                - contains
                                - not_contains
                                - regex
                                - gte
                                - lte
                                - exists
                                - not_exists
                                - empty
                                - not_empty
                              value: {}
                              tag:
                                type: object
                                properties:
                                  key:
                                    type: string
                                  match_type:
                                    type: string
                                    enum:
                                    - is
                                    - is_not
                                    - contains
                                    - not_contains
                                    - empty
                                    - not_empty
                                    - regex
                                  value:
                                    type: string
                              operand:
                                type: string
                                enum:
                                - and
                                - or
                              filters:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    field:
                                      type: string
                                    match_type:
                                      type: string
                                      enum:
                                      - is
                                      - is_not
                                      - contains
                                      - not_contains
                                      - regex
                                      - gte
                                      - lte
                                      - exists
                                      - not_exists
                                      - empty
                                      - not_empty
