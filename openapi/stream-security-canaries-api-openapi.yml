paths:
  /canaries:
    get:
      operationId: canaries-list
      summary: Get Canaries
      description: 'Retrieves a list of all deployed and configured canary resources across monitored accounts.


        A canary resource is a controlled, decoy asset - such as an S3 bucket - used to detect unauthorized activity by triggering alerts when predefined detection actions occur.


        This endpoint supports filtering by account ID, region, resource type, status, creator, and other attributes. Optional parameters allow inclusion of related activity logs for each canary.


        Returned objects include canary metadata, deployment status, detection settings, exclusion rules, and recent activity indicators.'
      tags:
      - Canaries
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: accountId
        schema:
          type: array
          items:
            type: string
      - in: query
        name: activityLogs
        schema:
          type: boolean
      - in: query
        name: createdBy
        schema:
          type: array
          items:
            type: string
      - in: query
        name: phrase
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: array
          items:
            type: string
      - in: query
        name: resourceId
        schema:
          type: array
          items:
            type: string
      - in: query
        name: resourceType
        schema:
          type: array
          items:
            type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - active
            - disabled
            - not_deployed
            - deleted
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
                    accountId:
                      type: string
                    subscriptionId:
                      type: string
                    resourceGroupId:
                      type: string
                    region:
                      type: string
                    resourceType:
                      type: string
                    description:
                      type: string
                    status:
                      type: string
                    createdBy:
                      type: string
                    createdAt:
                      type: string
                    attackPaths:
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        type: number
                    detectionsCount:
                      type: number
                    isSandbox:
                      type: boolean
                    hasActivityLogs:
                      type: boolean
                    initialTags:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          value:
                            type: string
                        required:
                        - key
                        - value
                        additionalProperties: false
                    excludeTags:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: string
                          key:
                            type: string
                          match_type:
                            type: string
                          value:
                            type: string
                        required:
                        - _id
                        - key
                        - match_type
                        - value
                        additionalProperties: false
                    resourceId:
                      type: string
                    iamRoles:
                      type: array
                      items:
                        type: string
                    allowProjectVmAccess:
                      type: boolean
                    detectionEnabled:
                      type: boolean
                    detectionActions:
                      type: array
                      items:
                        type: string
                    azureStorageAccountId:
                      type: string
                  required:
                  - _id
                  - name
                  - accountId
                  - region
                  - resourceType
                  - status
                  - createdAt
                  additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
