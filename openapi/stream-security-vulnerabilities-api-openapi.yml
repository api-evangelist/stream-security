openapi: 3.2.0
info:
  title: Stream Security Vulnerabilities API
  description: Stream Security API for managing security rules, integrations, AI interactions, and more.
  version: 1.0.0
servers:
- url: https://{app}.streamsec.io/openapi
tags:
- name: Vulnerabilities
paths:
  /cve/{cve_id}:
    get:
      operationId: cve-getCve
      summary: Get a single CVE by ID
      description: Retrieves detailed information about a specific CVE by its ID.
      tags:
      - Vulnerabilities
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: path
        name: cve_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    cve_id:
                      type: string
                    severity:
                      type: string
                      enum:
                      - CRITICAL
                      - HIGH
                      - MEDIUM
                      - LOW
                      - UNKNOWN
                    severity_numeric:
                      type: number
                    description:
                      anyOf:
                      - type: string
                      - type: 'null'
                    cvss_score:
                      anyOf:
                      - type: number
                      - type: 'null'
                    epss_score:
                      anyOf:
                      - type: number
                      - type: 'null'
                    cisa_kev:
                      anyOf:
                      - {}
                      - type: 'null'
                    cwes:
                      anyOf:
                      - type: array
                        items: {}
                      - type: 'null'
                    impact_score:
                      anyOf:
                      - type: number
                      - type: 'null'
                    exploitability_score:
                      anyOf:
                      - type: number
                      - type: 'null'
                    cvss_scoring_vector:
                      anyOf:
                      - type: string
                      - type: 'null'
                    packages:
                      type: array
                      items:
                        type: string
                    fixed_in_versions:
                      anyOf:
                      - type: array
                        items:
                          type: string
                      - type: 'null'
                    file_paths:
                      anyOf:
                      - type: array
                        items:
                          type: string
                      - type: 'null'
                    fix_available:
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    exploit_available:
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    cve_sources:
                      type: array
                      items:
                        type: string
                    fixed_in_version:
                      anyOf:
                      - type: string
                      - type: 'null'
                    published_date:
                      anyOf:
                      - type: string
                      - type: 'null'
                    discovery_timestamp:
                      anyOf:
                      - type: string
                      - type: 'null'
                    remediation:
                      anyOf:
                      - type: string
                      - type: 'null'
                    package_manager:
                      anyOf:
                      - type: string
                      - type: 'null'
                    attack_vector:
                      anyOf:
                      - type: string
                      - type: 'null'
                    attack_complexity:
                      anyOf:
                      - type: string
                      - type: 'null'
                    privileges_required:
                      anyOf:
                      - type: string
                      - type: 'null'
                    user_interaction:
                      anyOf:
                      - type: string
                      - type: 'null'
                    scope:
                      anyOf:
                      - type: string
                      - type: 'null'
                    confidentiality:
                      anyOf:
                      - type: string
                      - type: 'null'
                    integrity:
                      anyOf:
                      - type: string
                      - type: 'null'
                    availability:
                      anyOf:
                      - type: string
                      - type: 'null'
                    cvss_version:
                      anyOf:
                      - type: string
                      - type: 'null'
                    affected_resources_count:
                      anyOf:
                      - type: number
                      - type: 'null'
                    affected_images_count:
                      anyOf:
                      - type: number
                      - type: 'null'
                    internet_exposed:
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    container_images:
                      anyOf:
                      - type: array
                        items:
                          type: string
                      - type: 'null'
                    high_exposure_risk:
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    exposure_risk:
                      anyOf:
                      - type: string
                      - type: 'null'
                    exposure_risk_description:
                      anyOf:
                      - type: array
                        items:
                          type: string
                      - type: 'null'
                  required:
                  - cve_id
                  - severity
                  - severity_numeric
                  - description
                  - cvss_score
                  - epss_score
                  - cisa_kev
                  - cwes
                  - impact_score
                  - exploitability_score
                  - cvss_scoring_vector
                  - packages
                  - fixed_in_versions
                  - file_paths
                  - fix_available
                  - exploit_available
                  - cve_sources
                  - fixed_in_version
                  - published_date
                  - discovery_timestamp
                  - remediation
                  - package_manager
                  - attack_vector
                  - attack_complexity
                  - privileges_required
                  - user_interaction
                  - scope
                  - confidentiality
                  - integrity
                  - availability
                  - cvss_version
                  - affected_resources_count
                  - affected_images_count
                  - internet_exposed
                  - container_images
                  - high_exposure_risk
                  - exposure_risk
                  - exposure_risk_description
                  additionalProperties: false
                - type: 'null'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /cve/resources:
    get:
      operationId: cve-listCveResources
      summary: List resources affected by CVE(s)
      description: 'Retrieves a list of resources affected by specified CVE(s) with filtering and pagination.


        Array filters accept comma-separated values (e.g., cve_ids=CVE-2021-44228,CVE-2021-45046).


        For complex filters like tags, use the POST /cve/resources/query endpoint instead.'
      tags:
      - Vulnerabilities
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: cve_ids
        schema:
          type: string
      - in: query
        name: account_id
        schema:
          type: string
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: string
      - in: query
        name: vpc
        schema:
          type: string
      - in: query
        name: cluster_id
        schema:
          type: string
      - in: query
        name: namespace_id
        schema:
          type: string
      - in: query
        name: controller_id
        schema:
          type: string
      - in: query
        name: controller_kind
        schema:
          type: string
      - in: query
        name: container_images
        schema:
          type: string
      - in: query
        name: package
        schema:
          type: string
      - in: query
        name: internet_exposed
        schema:
          type: boolean
      - in: query
        name: high_exposure_risk
        schema:
          type: boolean
      - in: query
        name: skip
        schema:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - in: query
        name: limit
        schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        resource_id:
                          type: string
                        resource_type:
                          anyOf:
                          - type: string
                          - type: 'null'
                        account_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        region:
                          anyOf:
                          - type: string
                          - type: 'null'
                        cluster_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        namespace_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        controller_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        controller_kind:
                          anyOf:
                          - type: string
                          - type: 'null'
                        display_name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        container_images:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                        packages:
                          anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                package_version:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                fixed_in_version:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                file_path:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                              required:
                              - package_version
                              - fixed_in_version
                              - file_path
                              additionalProperties: false
                          - type: 'null'
                        internet_exposed:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        exposure_risk:
                          anyOf:
                          - type: string
                          - type: 'null'
                        exposure_risk_description:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                        child_resources:
                          anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                resource_id:
                                  type: string
                                resource_type:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                display_name:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                account_id:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                region:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                cluster_id:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                namespace_id:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                container_images:
                                  anyOf:
                                  - type: array
                                    items:
                                      type: string
                                  - type: 'null'
                                packages:
                                  anyOf:
                                  - type: array
                                    items:
                                      type: object
                                      properties:
                                        package_version:
                                          anyOf:
                                          - type: string
                                          - type: 'null'
                                        fixed_in_version:
                                          anyOf:
                                          - type: string
                                          - type: 'null'
                                        file_path:
                                          anyOf:
                                          - type: string
                                          - type: 'null'
                                      required:
                                      - package_version
                                      - fixed_in_version
                                      - file_path
                                      additionalProperties: false
                                  - type: 'null'
                                internet_exposed:
                                  anyOf:
                                  - type: boolean
                                  - type: 'null'
                                exposure_risk:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                exposure_risk_description:
                                  anyOf:
                                  - type: array
                                    items:
                                      type: string
                                  - type: 'null'
                              required:
                              - resource_id
                              - resource_type
                              - display_name
                              - account_id
                              - region
                              - cluster_id
                              - namespace_id
                              - container_images
                              - packages
                              - internet_exposed
                              - exposure_risk
                              - exposure_risk_description
                              additionalProperties: false
                          - type: 'null'
                      required:
                      - resource_id
                      - resource_type
                      - account_id
                      - region
                      - cluster_id
                      - namespace_id
                      - controller_id
                      - controller_kind
                      - display_name
                      - container_images
                      - packages
                      - internet_exposed
                      - exposure_risk
                      - exposure_risk_description
                      - child_resources
                      additionalProperties: false
                  total_count:
                    type: number
                required:
                - results
                - total_count
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /cve:
    get:
      operationId: cve-listCves
      summary: List CVEs with filtering, sorting, and pagination
      description: 'Retrieves a list of detected vulnerabilities (CVEs) across monitored environments, with details such as severity, CVSS score, exploit and fix availability, affected packages, impacted resources, and remediation guidance.


        Supports filtering by CVE ID, account, resource, resource type, package name, severity, exploit availability, fix availability, internet exposure, and region. Results can be sorted by CVE ID, severity, CVSS score, discovery time, or published date.


        Use this endpoint to review and prioritize vulnerabilities for remediation based on severity, exploitability, and exposure context.'
      tags:
      - Vulnerabilities
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: workspace
        schema:
          description: Workspace ID
          type: string
        description: Workspace ID
      - in: query
        name: cve_id
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
      - in: query
        name: cvss_score
        schema:
          type: number
      - in: query
        name: cvss_score_operator
        schema:
          type: string
          enum:
          - eq
          - gt
          - gte
          - lt
      - in: query
        name: epss_score
        schema:
          type: number
      - in: query
        name: epss_score_operator
        schema:
          type: string
          enum:
          - eq
          - gt
          - gte
          - lt
      - in: query
        name: packages
        schema:
          type: string
      - in: query
        name: fix_available
        schema:
          type: boolean
      - in: query
        name: exploit_available
        schema:
          type: boolean
      - in: query
        name: cisa_kev
        schema:
          type: boolean
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: attack_vector_network
        schema:
          type: boolean
      - in: query
        name: high_epss
        schema:
          type: boolean
      - in: query
        name: account_id
        schema:
          type: string
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: string
      - in: query
        name: availability_zones
        schema:
          type: string
      - in: query
        name: namespace
        schema:
          type: string
      - in: query
        name: eks_cluster
        schema:
          type: string
      - in: query
        name: ecs_cluster
        schema:
          type: string
      - in: query
        name: subnet
        schema:
          type: string
      - in: query
        name: vpc
        schema:
          type: string
      - in: query
        name: cluster_id
        schema:
          type: string
      - in: query
        name: namespace_id
        schema:
          type: string
      - in: query
        name: container_images
        schema:
          type: string
      - in: query
        name: internet_exposed
        schema:
          type: boolean
      - in: query
        name: high_exposure_risk
        schema:
          type: boolean
      - in: query
        name: risk_focus_enabled
        schema:
          type: boolean
      - in: query
        name: sort_by
        schema:
          default: cvss_score
          type: string
      - in: query
        name: sort_order
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: skip
        schema:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - in: query
        name: limit
        schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        cve_id:
                          type: string
                        severity:
                          type: string
                          enum:
                          - CRITICAL
                          - HIGH
                          - MEDIUM
                          - LOW
                          - UNKNOWN
                        severity_numeric:
                          type: number
                        description:
                          anyOf:
                          - type: string
                          - type: 'null'
                        cvss_score:
                          anyOf:
                          - type: number
                          - type: 'null'
                        epss_score:
                          anyOf:
                          - type: number
                          - type: 'null'
                        cisa_kev:
                          anyOf:
                          - {}
                          - type: 'null'
                        cwes:
                          anyOf:
                          - type: array
                            items: {}
                          - type: 'null'
                        impact_score:
                          anyOf:
                          - type: number
                          - type: 'null'
                        exploitability_score:
                          anyOf:
                          - type: number
                          - type: 'null'
                        cvss_scoring_vector:
                          anyOf:
                          - type: string
                          - type: 'null'
                        packages:
                          type: array
                          items:
                            type: string
                        fixed_in_versions:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                        file_paths:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                        fix_available:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        exploit_available:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        cve_sources:
                          type: array
                          items:
                            type: string
                        fixed_in_version:
                          anyOf:
                          - type: string
                          - type: 'null'
                        published_date:
                          anyOf:
                          - type: string
                          - type: 'null'
                        discovery_timestamp:
                          anyOf:
                          - type: string
                          - type: 'null'
                        remediation:
                          anyOf:
                          - type: string
                          - type: 'null'
                        package_manager:
                          anyOf:
                          - type: string
                          - type: 'null'
                        attack_vector:
                          anyOf:
                          - type: string
                          - type: 'null'
                        attack_complexity:
                          anyOf:
                          - type: string
                          - type: 'null'
                        privileges_required:
                          anyOf:
                          - type: string
                          - type: 'null'
                        user_interaction:
                          anyOf:
                          - type: string
                          - type: 'null'
                        scope:
                          anyOf:
                          - type: string
                          - type: 'null'
                        confidentiality:
                          anyOf:
                          - type: string
                          - type: 'null'
                        integrity:
                          anyOf:
                          - type: string
                          - type: 'null'
                        availability:
                          anyOf:
                          - type: string
                          - type: 'null'
                        cvss_version:
                          anyOf:
                          - type: string
                          - type: 'null'
                        affected_resources_count:
                          anyOf:
                          - type: number
                          - type: 'null'
                        affected_images_count:
                          anyOf:
                          - type: number
                          - type: 'null'
                        internet_exposed:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        container_images:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                        high_exposure_risk:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        exposure_risk:
                          anyOf:
                          - type: string
                          - type: 'null'
                        exposure_risk_description:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                      required:
                      - cve_id
                      - severity
                      - severity_numeric
                      - description
                      - cvss_score
                      - epss_score
                      - cisa_kev
                      - cwes
                      - impact_score
                      - exploitability_score
                      - cvss_scoring_vector
                      - packages
                      - fixed_in_versions
                      - file_paths
                      - fix_available
                      - exploit_available
                      - cve_sources
                      - fixed_in_version
                      - published_date
                      - discovery_timestamp
                      - remediation
                      - package_manager
                      - attack_vector
                      - attack_complexity
                      - privileges_required
                      - user_interaction
                      - scope
                      - confidentiality
                      - integrity
                      - availability
                      - cvss_version
                      - affected_resources_count
                      - affected_images_count
                      - internet_exposed
                      - container_images
                      - high_exposure_risk
                      - exposure_risk
                      - exposure_risk_description
                      additionalProperties: false
                  total_count:
                    type: number
                required:
                - results
                - total_count
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
components:
  schemas:
    error.UNAUTHORIZED:
      title: Authorization not provided error (401)
      description: The error information
      example:
        code: UNAUTHORIZED
        message: Authorization not provided
        issues: []
      type: object
      properties:
        message:
          description: The error message
          example: Authorization not provided
          type: string
        code:
          description: The error code
          example: UNAUTHORIZED
          type: string
        issues:
          description: An array of issues that were responsible for the error
          example: []
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
            additionalProperties: false
      required:
      - message
      - code
      additionalProperties: false
    error.INTERNAL_SERVER_ERROR:
      title: Internal server error error (500)
      description: The error information
      example:
        code: INTERNAL_SERVER_ERROR
        message: Internal server error
        issues: []
      type: object
      properties:
        message:
          description: The error message
          example: Internal server error
          type: string
        code:
          description: The error code
          example: INTERNAL_SERVER_ERROR
          type: string
        issues:
          description: An array of issues that were responsible for the error
          example: []
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
            additionalProperties: false
      required:
      - message
      - code
      additionalProperties: false
    error.BAD_REQUEST:
      title: Invalid input data error (400)
      description: The error information
      example:
        code: BAD_REQUEST
        message: Invalid input data
        issues: []
      type: object
