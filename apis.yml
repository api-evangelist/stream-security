  description: >-
    Hosted remote MCP server that lets an agent query the Stream Security CloudTwin in natural language
    - resource metadata, configuration changes, misconfigurations, external exposures, excessive privileges,
    and threat-detection triage against identity, network and Kubernetes audit logs. Documented as a preview;
    tool schemas are auth-gated behind a Stream Security API token.
