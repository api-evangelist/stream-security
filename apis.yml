apis:
- name: Stream Security API
  description: >-
    REST API over the Stream Security CloudTwin. 34 operations across twelve resource groups -
    inventory, attack paths, config changes, threat detections, detection rules, posture security
    rules and violations, vulnerabilities (CVE), network and identity logs, Kubernetes/ECS agent
    integrations, notification rules, canaries and workspaces. Bearer (JWT) API token auth, with an
    optional `workspace` header to target a specific workspace.
  humanURL: https://docs.streamsec.io/reference/getting-started-with-stream-api
  baseURL: https://{app}.streamsec.io/openapi
