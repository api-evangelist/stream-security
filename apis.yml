aid: stream-security
name: Stream.Security
description: >-
  Stream.Security (formerly Lightlytics) is a cloud detection and response (CDR) and real-time CNAPP
  vendor that builds a live model of a customer's cloud - its "CloudTwin" - by continuously ingesting
  configuration state and activity from AWS, Azure, GCP, Kubernetes, ECS and VMware vSphere, then
  correlating posture drift against runtime behaviour to expose exploitable attack paths, excessive
  privilege, external exposure and active threats. The platform combines cloud-native log ingestion
  (CloudTrail, VPC Flow Logs, Route53 DNS, ELB/ALB, WAF, Entra ID audit) with eBPF runtime agents on
  Kubernetes, ECS and standalone VMs, adds canary/trap decoy resources and auto-remediation, and
  exposes it all through a public REST API and an MCP server so security teams and agents can query
  inventory, detections, vulnerabilities, attack paths and posture violations programmatically.
