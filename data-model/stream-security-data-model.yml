id_prefixes:
  published: false
  note: >-
    Stream.Security does not publish typed/prefixed identifiers (no `res_`, `det_` style scheme).
    Cloud-native identifiers (ARNs, Azure resource IDs, Kubernetes UIDs) are passed through, so id
    format varies by cloud provider and resource type rather than by Stream Security object type.
