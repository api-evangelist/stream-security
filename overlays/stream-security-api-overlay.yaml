actions:
- target: $.info
  description: Record provenance and the documentation entry points on the spec itself.
  update:
    contact:
      name: Stream Security
      url: https://www.stream.security/contact-us
    termsOfService: https://www.stream.security/terms
    x-documentation: https://docs.streamsec.io/
    x-api-reference: https://docs.streamsec.io/reference
    x-getting-started: https://docs.streamsec.io/reference/getting-started-with-stream-api
    x-llms-txt: https://docs.streamsec.io/llms.txt
    x-provider-former-name: Lightlytics
- target: $.servers[0]
  description: >-
    Declare the {app} server variable the provider's own server URL already references but never
    defines. The default is the documented tenant host from the MCP configuration example
    (https://app.streamsec.io); the host itself is NOT changed.
  update:
    variables:
      app:
        default: app
        description: >-
          Tenant subdomain of the Stream Security application host. The documentation's MCP
          configuration example uses https://app.streamsec.io as "YOUR STREAM SECURITY DOMAIN URL".
- target: $.components.securitySchemes.BearerAuth
  description: Attach token provisioning, expiry and revocation facts published in the docs.
  update:
    description: >-
      API token minted in the Stream UI under Organization/Workspace Settings -> API Token
      Management. Permission is Read & Write or Read Only; scope is organization-wide or selected
      workspaces. Expiry is chosen at creation (1/7/30/90 days, 1 year, or never). Revocation is
      immediate; revoked tokens stay visible for 90 days. Tokens are auto-revoked when the creating
      user is deactivated or downgraded.
    x-docs: https://docs.streamsec.io/docs/token-management
- target: $
  description: >-
    Record cross-cutting runtime semantics that the base spec does not state, each cross-linked to
    the artifact that carries the evidence.
  update:
    x-conventions: conventions/stream-security-conventions.yml
    x-error-catalog: errors/stream-security-problem-types.yml
    x-data-model: data-model/stream-security-data-model.yml
    x-webhooks: asyncapi/stream-security-notifications-webhooks.yml
    x-mcp-server: https://app.streamsec.io/mcp
    x-tenancy-header: workspace
    x-idempotency: none
    x-rate-limits: undocumented
    x-error-format: 'custom-json {code,message,issues[]} - not RFC 9457'
