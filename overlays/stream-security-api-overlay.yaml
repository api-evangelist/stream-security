x-extends: openapi/stream-security-api-openapi.json
x-source: >-
  Enhancements derived by API Evangelist from the provider's own published documentation
  (docs.streamsec.io) and live probes on 2026-08-29. This overlay is additive and never mutates the
  captured spec. IMPORTANT - the base document was assembled from the provider's per-operation
  OpenAPI fragments published at https://docs.streamsec.io/reference/*.md; the servers[] block
  below is added ONLY as a variables declaration for the {app} template the provider already
