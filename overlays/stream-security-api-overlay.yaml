- target: $.paths['/notifications/{id}'].delete
  description: >-
    Surface the irreversibility the provider states in prose so an agent reading the contract alone
    can see it before acting.
  update:
    x-reversible: false
    x-reversal-window: null
    x-safer-alternative: >-
      PATCH /notifications/{id} with enabled:false disables the rule without destroying it.
    x-provider-statement: >-
      "Permanently deletes a notification rule. This action cannot be undone."
- target: $.paths['/detections/comment'].post
  description: Record that this write has no reversal operation anywhere in the API.
  update:
